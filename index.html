<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>60s NEWS ― ニュースを、あなたの生活の話に。</title>
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="60s NEWS">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <p class="loading">読み込み中…</p>
  </div>
  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-backdrop" data-close="1"></div>
    <div class="sheet-body">
      <div class="sheet-title" id="sheet-title"></div>
      <div class="sheet-text" id="sheet-text"></div>
      <button class="btn btn-sub" data-close="1">閉じる</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
